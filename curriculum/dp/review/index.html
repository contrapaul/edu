<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Build a custom multiple choice review quiz from any combination of IB DP Design Technology topics. Take it online or print it with a teacher's answer key.">
<title>Review Quiz Builder | DP Design Technology | contrapaul edu</title>
<link rel="canonical" href="https://edu.contrapaul.com/curriculum/dp/review/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="contrapaul / edu">
<meta property="og:title" content="Review Quiz Builder | DP Design Technology">
<meta property="og:description" content="Build a custom multiple choice review quiz from any combination of IB DP Design Technology topics.">
<meta property="og:url" content="https://edu.contrapaul.com/curriculum/dp/review/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../../style.css">
<link rel="stylesheet" href="../../curriculum.css">
<link rel="stylesheet" href="../../themes.css">
<link rel="stylesheet" href="review.css">
<script>
  (function(){var t=localStorage.getItem('edu-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<div class="brand"><a href="/" class="wordmark">contrapaul <span class="brand-sub">/ edu</span></a></div>
<nav class="nav"><a href="/curriculum">Curriculum</a><a href="/tools">Tools</a><a href="/about">About</a><a href="https://contrapaul.com" class="nav-external">← Main site</a></nav>
</div>
</header>

<main class="rv-main">

<div class="rv-top">
<h1 class="rv-h1"><span class="rv-h1-sub">DP DT Quiz Builder</span></h1>

<div class="rv-actions">
<span class="rv-count"><span class="rv-count-label">Question Count:</span><span class="rv-count-num" id="start-count">0</span></span>
<button class="rv-btn rv-btn-primary" id="start-quiz">Start Quiz</button>
<button class="rv-btn" id="make-print">Create printable quiz</button>
<span class="rv-actions-gap"></span>
<button class="rv-btn" data-quick="10">Quick 10</button>
<button class="rv-btn" data-quick="20">Quick 20</button>
<button class="rv-btn" data-quick="30">Quick 30</button>
<button class="rv-btn rv-btn-quiet" id="pool-restore">Restore all</button>
</div>

<div class="rv-filters">
<div class="rv-pill-row" id="level-row">
<button class="rv-pill" data-level="SL">SL</button>
<button class="rv-pill" data-level="HL">HL</button>
<button class="rv-pill" data-level="ALL">SL + HL</button>
</div>
<div class="rv-pill-row rv-topic-row" id="topic-row" hidden>
<button class="rv-pill rv-pill-quiet" id="topics-all">Select all</button>
<button class="rv-pill rv-pill-quiet" id="topics-none">Clear</button>
<span class="rv-pill-div"></span>
<span class="rv-pill-set" id="topic-pills"></span>
</div>
</div>
</div>

<p class="rv-pool-note" id="pool-note"></p>
<div id="pool"></div>

</main>

<dialog class="rv-dialog" id="title-dialog">
<form id="title-form">
<label class="rv-dialog-label" for="quiz-title">Name this quiz</label>
<input type="text" id="quiz-title" placeholder="DP Design Technology Review" maxlength="70" autocomplete="off">
<p class="rv-dialog-hint">The name appears at the top of the quiz sheet and the answer guide.</p>
<div class="rv-dialog-actions">
<button type="button" class="rv-btn" id="title-cancel">Cancel</button>
<button type="submit" class="rv-btn rv-btn-primary">Continue to quiz</button>
</div>
</form>
</dialog>

<footer class="site-footer"><div class="footer-inner"><span class="footer-brand"><a href="https://edu.contrapaul.com">contrapaul / edu</a> / <a href="https://blog.contrapaul.com">blog</a> / <a href="https://make.contrapaul.com">make</a></span><span class="footer-note">Not affiliated with the IB Organisation</span></div></footer>
<script src="../../curriculum-themes.js"></script>
<script src="review.js"></script>
</body>
</html>
