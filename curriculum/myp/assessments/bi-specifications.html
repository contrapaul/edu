<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
/* ═══════════════════════════════════════════════════════════════
   Bi DESIGN SPECIFICATIONS
   One side at 1123 x 794, which is A4 landscape at 96dpi. Six
   specification cards in two columns of three. The worksheet holds
   no teaching text: what a specification is, what the categories
   mean and the worked examples all live on the unit page, and the
   instructions live on the task sheet. Fonts are self-hosted.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family:'Lexend'; src:url('../../../Fonts/Lexend%20Family/webfonts/Lexend-Regular.woff2') format('woff2');  font-weight:400; font-display:swap; }
@font-face { font-family:'Lexend'; src:url('../../../Fonts/Lexend%20Family/webfonts/Lexend-Medium.woff2') format('woff2');   font-weight:500; font-display:swap; }
@font-face { font-family:'Lexend'; src:url('../../../Fonts/Lexend%20Family/webfonts/Lexend-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
@font-face { font-family:'Lexend'; src:url('../../../Fonts/Lexend%20Family/webfonts/Lexend-Bold.woff2') format('woff2');     font-weight:700; font-display:swap; }
@font-face { font-family:'JetBrains Mono'; src:url('../../../Fonts/Jetbrains/woff2/JetBrainsMono-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'JetBrains Mono'; src:url('../../../Fonts/Jetbrains/woff2/JetBrainsMono-Bold.woff2') format('woff2');    font-weight:700; font-display:swap; }

:root {
  --ink:#14171c; --mid:#5b6472; --line:#c8cdd6; --hair:#e4e7ec;
  --accent:#7a2c4e; --page:#fff; --desk:#eceef2;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --body:'Lexend','Helvetica Neue',Helvetica,Arial,sans-serif;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--desk); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; align-items:center; padding:20px 12px 60px; }

.bar { width:1123px; max-width:100%; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:12px; }
.bar h1 { font-size:1rem; font-weight:600; margin:0 auto 0 0; }
.bar h1 span { color:var(--mid); font-weight:400; }
.btn { font-family:var(--mono); font-size:0.68rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  padding:0.5rem 0.85rem; border-radius:7px; cursor:pointer; background:var(--page); color:var(--ink); border:1px solid var(--line); }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn-go { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-go:hover { color:#fff; filter:brightness(1.12); }
.hint { width:1123px; max-width:100%; margin:0 0 14px; font-size:0.78rem; color:var(--mid); }
.savestate { font-family:var(--mono); font-size:0.68rem; letter-spacing:0.04em; color:var(--mid); }

/* ── THE SHEET ───────────────────────────────────────────────── */
.sheet { width:1123px; height:794px; background:var(--page); padding:30px 36px 24px;
  box-shadow:0 2px 6px rgba(0,0,0,0.10), 0 14px 40px rgba(0,0,0,0.13);
  display:flex; flex-direction:column; }

.sheet-head { display:flex; align-items:baseline; gap:22px;
  border-bottom:2px solid var(--ink); padding-bottom:7px; }
.sheet-title { font-size:19px; font-weight:700; margin:0; white-space:nowrap; }
.sheet-title .sheet-code { color:var(--accent); }

/* Identity sits on the title line, so the sheet opens straight into
   the cards. The fields share whatever width the title leaves. */
.ident { display:flex; align-items:baseline; gap:16px; flex:1; min-width:0; }
/* The four identity fields share one line, so the two that take a
   short answer give their width to the two that do not. */
.f { display:flex; align-items:baseline; gap:6px; min-width:0; flex:1; }
.f.f-name { flex:0.82; }
.f.f-team { flex:0.92; }
.f.f-date { flex:0.46; }
.f.f-aud  { flex:1.35; }
.f > label { font-family:var(--mono); font-size:8.5px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--mid); white-space:nowrap; }
input[type=text] { font-family:var(--body); font-size:12px; color:var(--ink); border:none;
  border-bottom:1px solid var(--line); background:transparent; padding:1px 2px 2px; width:100%; min-width:0; }
input[type=text]:focus { outline:none; border-bottom-color:var(--accent); background:#fdf5f8; }

/* ── specification cards ─────────────────────────────────────── */
.cards { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr;
  gap:11px 16px; margin:12px 0 0; min-height:0; }
.card { display:flex; flex-direction:column; gap:6px; min-height:0; min-width:0;
  border:1px solid var(--hair); border-left:3px solid var(--line); border-radius:5px; padding:7px 10px 8px; }
.card.filled { border-left-color:var(--accent); }
.card-top { display:grid; grid-template-columns:auto 1fr 1fr; gap:10px; align-items:center; }
.card-n { font-family:var(--mono); font-size:10px; font-weight:700; color:var(--accent);
  width:18px; height:18px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--hair); border-radius:4px; }
.card.filled .card-n { background:var(--accent); color:#fff; border-color:var(--accent); }

select { font-family:var(--body); font-size:10.5px; color:var(--ink); width:100%; min-width:0;
  border:none; border-bottom:1px solid var(--line); background:transparent;
  padding:1px 2px 2px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mid) 50%),linear-gradient(135deg,var(--mid) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%, calc(100% - 5px) 55%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat; padding-right:16px; }
select:focus { outline:none; border-bottom-color:var(--accent); }
select.empty { color:var(--mid); }

.fld { display:flex; flex-direction:column; gap:1px; min-width:0; }
.fld > span { font-family:var(--mono); font-size:7px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--mid); }
.card-two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card .why { display:flex; flex-direction:column; gap:1px; flex:1; min-height:0; }
.card .why > span { font-family:var(--mono); font-size:7px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--mid); }
.card textarea {
  flex:1; min-height:0; resize:none;
  font-family:var(--body); font-size:10.5px; line-height:1.5; color:var(--ink);
  border:none; background:transparent; padding:3px 2px 0; width:100%;
  background-image:repeating-linear-gradient(transparent, transparent 15px, var(--hair) 15px, var(--hair) 16px);
  background-position:0 3px; }
.card textarea:focus { outline:none; background-color:#fdf5f8; }

.sheet-foot { margin-top:9px; padding-top:7px; border-top:1px solid var(--hair);
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:7.5px; letter-spacing:0.08em; color:var(--mid); }

@media (max-width:1180px) {
  body { padding:14px 8px 40px; }
  .sheet { transform:scale(calc((100vw - 24px)/1123)); transform-origin:top center;
    margin-bottom:calc((100vw - 24px)/1123 * 794 - 794px); }
}

@page { size:A4 landscape; margin:0; }
@media print {
  body { background:#fff; padding:0; display:block; }
  .bar, .hint { display:none !important; }
  .sheet { width:297mm; height:210mm; padding:9mm 11mm; box-shadow:none; transform:none; margin:0; }
  input[type=text], select { border-color:#b9bfc9; }
  select { background-image:none; }
  .card.filled .card-n, .card-n, .sheet-title .sheet-code {
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>

<div class="bar">
  <h1>Bi Design Specifications <span>/ six specifications, one page</span></h1>
  <button class="btn" id="btn-clear" type="button">Clear</button>
  <button class="btn" id="btn-print" type="button">Print</button>
  <button class="btn btn-go" id="btn-png" type="button">Download PNG</button>
</div>
<p class="hint">One A4 landscape side. Fill it in here and download the PNG to hand in, or print it and write on it. <span id="savestate" class="savestate">Your work saves in this browser as you type.</span></p>

<div id="sheets"></div>

<script src="bi-specifications.js"></script>
</body>
</html>
