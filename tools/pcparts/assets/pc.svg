<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" id="pc-diagram"
     role="img" aria-label="Cutaway view of a modern desktop computer with the side panel in place">

  <!-- REFERENCE ART. Placeholder for a hand-drawn replacement.
       Layer contract (keep these ids when redrawing):
         case-shell   case body, front bezel, rear panel
         mobo-bare    board with EMPTY socket, DIMM, PCIe and M.2 slots
         part-*       removable hardware, each a single group
         case-glass   side panel, must be last so it stacks on top
         hit          one simple shape per part, id hit-<part>, zero opacity in CSS
       Stacking order below is load bearing: storage sits under gpu, cpu under
       cooler, so occlusion works without any extra geometry. -->

  <defs>
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9fd0ff" stop-opacity="0.20"/>
      <stop offset="45%"  stop-color="#dff0ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6ea8dd" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="g-ihs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dce4"/>
      <stop offset="100%" stop-color="#98a0ad"/>
    </linearGradient>
    <linearGradient id="g-fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aab2bf"/>
      <stop offset="100%" stop-color="#7c8593"/>
    </linearGradient>
    <pattern id="p-mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.8" fill="#3a414d"/>
    </pattern>
  </defs>

  <!-- ══ case-shell ══ -->
  <g id="case-shell">
    <rect x="30" y="20" width="900" height="740" rx="16" fill="#272c36"/>
    <rect x="95" y="50" width="785" height="680" fill="#14171d"/>
    <rect x="30" y="20" width="65" height="740" rx="16" fill="#20242c"/>
    <rect x="42" y="60" width="42" height="660" rx="8" fill="url(#p-mesh)"/>
    <rect x="880" y="20" width="50" height="740" rx="16" fill="#20242c"/>
    <rect x="95" y="588" width="785" height="12" fill="#1b1f27"/>
    <g fill="#3a414d">
      <rect x="890" y="300" width="30" height="8" rx="4"/>
      <rect x="890" y="316" width="30" height="8" rx="4"/>
      <rect x="890" y="332" width="30" height="8" rx="4"/>
      <rect x="890" y="348" width="30" height="8" rx="4"/>
    </g>
  </g>

  <!-- ══ mobo-bare ══ empty board, revealed as parts are removed -->
  <g id="mobo-bare">
    <rect x="300" y="70" width="570" height="500" rx="6" fill="#1d3b2e"/>
    <rect x="300" y="70" width="570" height="500" rx="6" fill="none" stroke="#2f6350" stroke-width="2"/>
    <g stroke="#2c5d4a" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M330 110 H430 V150 H520"/>
      <path d="M330 130 H400 V220 H470"/>
      <path d="M340 460 H600 V520 H700"/>
      <path d="M760 130 V300 H820"/>
      <path d="M420 300 V430 H520"/>
    </g>
    <g fill="#8fb3a5" opacity="0.55">
      <circle cx="312" cy="82" r="5"/><circle cx="858" cy="82" r="5"/>
      <circle cx="312" cy="558" r="5"/><circle cx="858" cy="558" r="5"/>
      <circle cx="585" cy="82" r="5"/><circle cx="585" cy="558" r="5"/>
    </g>

    <!-- rear I/O shroud -->
    <rect x="778" y="76" width="92" height="92" rx="6" fill="#3b424e"/>
    <g fill="#1b1f27">
      <rect x="788" y="88" width="26" height="14" rx="3"/>
      <rect x="820" y="88" width="26" height="14" rx="3"/>
      <rect x="788" y="110" width="26" height="14" rx="3"/>
      <rect x="820" y="110" width="26" height="14" rx="3"/>
      <rect x="788" y="132" width="58" height="24" rx="4"/>
    </g>

    <!-- VRM heatsink -->
    <rect x="616" y="90" width="150" height="34" rx="4" fill="#4a5361"/>
    <g stroke="#39414d" stroke-width="2">
      <path d="M628 92 V122"/><path d="M646 92 V122"/><path d="M664 92 V122"/>
      <path d="M682 92 V122"/><path d="M700 92 V122"/><path d="M718 92 V122"/>
      <path d="M736 92 V122"/><path d="M754 92 V122"/>
    </g>

    <!-- empty CPU socket -->
    <rect x="634" y="184" width="112" height="112" rx="4" fill="#2a2f38"/>
    <rect x="644" y="194" width="92" height="92" rx="2" fill="#171a21"/>
    <g fill="#454d5b">
      <rect x="650" y="200" width="80" height="3"/><rect x="650" y="210" width="80" height="3"/>
      <rect x="650" y="220" width="80" height="3"/><rect x="650" y="230" width="80" height="3"/>
      <rect x="650" y="240" width="80" height="3"/><rect x="650" y="250" width="80" height="3"/>
      <rect x="650" y="260" width="80" height="3"/><rect x="650" y="270" width="80" height="3"/>
    </g>

    <!-- empty DIMM slots -->
    <g fill="#22262f">
      <rect x="466" y="130" width="22" height="180" rx="3"/>
      <rect x="494" y="130" width="22" height="180" rx="3"/>
      <rect x="522" y="130" width="22" height="180" rx="3"/>
      <rect x="550" y="130" width="22" height="180" rx="3"/>
    </g>

    <!-- 24 pin power -->
    <rect x="306" y="180" width="22" height="120" rx="3" fill="#2a2f38"/>

    <!-- PCIe slots, empty -->
    <rect x="616" y="398" width="248" height="18" rx="3" fill="#26303c"/>
    <rect x="700" y="470" width="164" height="14" rx="3" fill="#26303c"/>

    <!-- M.2 slots, empty -->
    <rect x="496" y="350" width="152" height="16" rx="3" fill="#22303a"/>
    <rect x="496" y="500" width="152" height="16" rx="3" fill="#22303a"/>

    <!-- chipset heatsink -->
    <rect x="700" y="504" width="92" height="60" rx="5" fill="#3b424e"/>
    <g stroke="#2f3641" stroke-width="2">
      <path d="M712 508 V560"/><path d="M730 508 V560"/><path d="M748 508 V560"/><path d="M766 508 V560"/>
    </g>
  </g>

  <!-- ══ part-psu ══ -->
  <g id="part-psu">
    <rect x="614" y="612" width="252" height="110" rx="6" fill="#232831"/>
    <rect x="614" y="612" width="252" height="110" rx="6" fill="none" stroke="#39414d" stroke-width="2"/>
    <circle cx="700" cy="667" r="42" fill="#1a1e25"/>
    <g stroke="#4a5361" stroke-width="3" fill="none">
      <circle cx="700" cy="667" r="34"/><circle cx="700" cy="667" r="24"/><circle cx="700" cy="667" r="14"/>
    </g>
    <circle cx="700" cy="667" r="7" fill="#5b6472"/>
    <g fill="#2f3641">
      <rect x="792" y="628" width="58" height="12" rx="3"/>
      <rect x="792" y="648" width="58" height="12" rx="3"/>
      <rect x="792" y="668" width="58" height="12" rx="3"/>
      <rect x="792" y="688" width="58" height="12" rx="3"/>
    </g>
  </g>

  <!-- ══ part-fans ══ -->
  <g id="part-fans">
    <g id="fan-front-top">
      <rect x="112" y="92" width="158" height="158" rx="10" fill="#2b313b"/>
      <circle cx="191" cy="171" r="66" fill="#1a1e25"/>
      <g fill="#414a58">
        <path d="M191 171 L191 107 A64 64 0 0 1 236 126 Z"/>
        <path d="M191 171 L236 126 A64 64 0 0 1 250 190 Z"/>
        <path d="M191 171 L250 190 A64 64 0 0 1 209 233 Z"/>
        <path d="M191 171 L209 233 A64 64 0 0 1 146 220 Z"/>
        <path d="M191 171 L146 220 A64 64 0 0 1 133 152 Z"/>
        <path d="M191 171 L133 152 A64 64 0 0 1 191 107 Z"/>
      </g>
      <circle cx="191" cy="171" r="20" fill="#525c6b"/>
    </g>
    <g id="fan-front-bottom">
      <rect x="112" y="272" width="158" height="158" rx="10" fill="#2b313b"/>
      <circle cx="191" cy="351" r="66" fill="#1a1e25"/>
      <g fill="#414a58">
        <path d="M191 351 L191 287 A64 64 0 0 1 236 306 Z"/>
        <path d="M191 351 L236 306 A64 64 0 0 1 250 370 Z"/>
        <path d="M191 351 L250 370 A64 64 0 0 1 209 413 Z"/>
        <path d="M191 351 L209 413 A64 64 0 0 1 146 400 Z"/>
        <path d="M191 351 L146 400 A64 64 0 0 1 133 332 Z"/>
        <path d="M191 351 L133 332 A64 64 0 0 1 191 287 Z"/>
      </g>
      <circle cx="191" cy="351" r="20" fill="#525c6b"/>
    </g>
    <g id="fan-rear">
      <rect x="796" y="180" width="82" height="82" rx="8" fill="#2b313b"/>
      <circle cx="837" cy="221" r="33" fill="#1a1e25"/>
      <g fill="#414a58">
        <path d="M837 221 L837 189 A32 32 0 0 1 860 199 Z"/>
        <path d="M837 221 L860 199 A32 32 0 0 1 866 231 Z"/>
        <path d="M837 221 L866 231 A32 32 0 0 1 846 252 Z"/>
        <path d="M837 221 L846 252 A32 32 0 0 1 814 246 Z"/>
        <path d="M837 221 L814 246 A32 32 0 0 1 808 213 Z"/>
        <path d="M837 221 L808 213 A32 32 0 0 1 837 189 Z"/>
      </g>
      <circle cx="837" cy="221" r="10" fill="#525c6b"/>
    </g>
  </g>

  <!-- ══ part-storage ══ M.2 drive, sits under the graphics card -->
  <g id="part-storage">
    <rect x="496" y="346" width="152" height="24" rx="3" fill="#1c3a4a"/>
    <rect x="504" y="350" width="34" height="16" rx="2" fill="#2b2f38"/>
    <rect x="546" y="350" width="34" height="16" rx="2" fill="#2b2f38"/>
    <rect x="588" y="350" width="22" height="16" rx="2" fill="#3a3f4a"/>
    <g fill="#8fa6b3">
      <rect x="632" y="350" width="3" height="16"/><rect x="637" y="350" width="3" height="16"/>
      <rect x="642" y="350" width="3" height="16"/>
    </g>
  </g>

  <!-- ══ part-ram ══ -->
  <g id="part-ram">
    <g fill="#39414f">
      <rect x="464" y="122" width="26" height="192" rx="4"/>
      <rect x="492" y="122" width="26" height="192" rx="4"/>
      <rect x="520" y="122" width="26" height="192" rx="4"/>
      <rect x="548" y="122" width="26" height="192" rx="4"/>
    </g>
    <g fill="#6f7a8c">
      <rect x="468" y="128" width="18" height="6" rx="3"/>
      <rect x="496" y="128" width="18" height="6" rx="3"/>
      <rect x="524" y="128" width="18" height="6" rx="3"/>
      <rect x="552" y="128" width="18" height="6" rx="3"/>
    </g>
    <g fill="#2a303b">
      <rect x="468" y="150" width="18" height="140" rx="2"/>
      <rect x="496" y="150" width="18" height="140" rx="2"/>
      <rect x="524" y="150" width="18" height="140" rx="2"/>
      <rect x="552" y="150" width="18" height="140" rx="2"/>
    </g>
  </g>

  <!-- ══ part-cpu ══ sits under the cooler -->
  <g id="part-cpu">
    <rect x="640" y="190" width="100" height="100" rx="5" fill="#3d434e"/>
    <rect x="648" y="198" width="84" height="84" rx="4" fill="url(#g-ihs)"/>
    <rect x="666" y="216" width="48" height="48" rx="3" fill="#b6bcc6"/>
    <g stroke="#7b838f" stroke-width="1.5" fill="none">
      <path d="M656 206 H724"/><path d="M656 274 H724"/>
    </g>
  </g>

  <!-- ══ part-gpu ══ covers the M.2 drive and the x16 slot -->
  <g id="part-gpu">
    <rect x="330" y="338" width="536" height="116" rx="8" fill="#20242c"/>
    <rect x="330" y="338" width="536" height="116" rx="8" fill="none" stroke="#39414d" stroke-width="2"/>
    <rect x="342" y="350" width="512" height="92" rx="6" fill="#171a21"/>
    <g>
      <circle cx="440" cy="396" r="42" fill="#22272f"/>
      <g fill="#3c4450">
        <path d="M440 396 L440 354 A42 42 0 0 1 470 366 Z"/>
        <path d="M440 396 L470 366 A42 42 0 0 1 479 407 Z"/>
        <path d="M440 396 L479 407 A42 42 0 0 1 452 436 Z"/>
        <path d="M440 396 L452 436 A42 42 0 0 1 411 427 Z"/>
        <path d="M440 396 L411 427 A42 42 0 0 1 402 385 Z"/>
        <path d="M440 396 L402 385 A42 42 0 0 1 440 354 Z"/>
      </g>
      <circle cx="440" cy="396" r="13" fill="#525c6b"/>
    </g>
    <g>
      <circle cx="600" cy="396" r="42" fill="#22272f"/>
      <g fill="#3c4450">
        <path d="M600 396 L600 354 A42 42 0 0 1 630 366 Z"/>
        <path d="M600 396 L630 366 A42 42 0 0 1 639 407 Z"/>
        <path d="M600 396 L639 407 A42 42 0 0 1 612 436 Z"/>
        <path d="M600 396 L612 436 A42 42 0 0 1 571 427 Z"/>
        <path d="M600 396 L571 427 A42 42 0 0 1 562 385 Z"/>
        <path d="M600 396 L562 385 A42 42 0 0 1 600 354 Z"/>
      </g>
      <circle cx="600" cy="396" r="13" fill="#525c6b"/>
    </g>
    <rect x="700" y="352" width="150" height="88" rx="5" fill="#262b34"/>
    <g stroke="#39414d" stroke-width="2">
      <path d="M712 356 V436"/><path d="M730 356 V436"/><path d="M748 356 V436"/>
      <path d="M766 356 V436"/><path d="M784 356 V436"/><path d="M802 356 V436"/>
      <path d="M820 356 V436"/><path d="M838 356 V436"/>
    </g>
    <rect x="862" y="330" width="16" height="132" rx="3" fill="#4a5361"/>
    <g fill="#1b1f27">
      <rect x="864" y="346" width="12" height="26" rx="2"/>
      <rect x="864" y="380" width="12" height="26" rx="2"/>
      <rect x="864" y="414" width="12" height="26" rx="2"/>
    </g>
    <g fill="#2f3641">
      <rect x="360" y="326" width="30" height="14" rx="3"/>
      <rect x="398" y="326" width="30" height="14" rx="3"/>
    </g>
  </g>

  <!-- ══ part-cooler ══ covers the processor -->
  <g id="part-cooler">
    <rect x="616" y="96" width="152" height="204" rx="6" fill="url(#g-fin)"/>
    <g stroke="#6a7280" stroke-width="2">
      <path d="M616 112 H768"/><path d="M616 128 H768"/><path d="M616 144 H768"/>
      <path d="M616 160 H768"/><path d="M616 176 H768"/><path d="M616 192 H768"/>
      <path d="M616 208 H768"/><path d="M616 224 H768"/><path d="M616 240 H768"/>
      <path d="M616 256 H768"/><path d="M616 272 H768"/><path d="M616 288 H768"/>
    </g>
    <g fill="#8b93a1" stroke="#69717f" stroke-width="1.5">
      <rect x="640" y="90" width="14" height="14" rx="7"/>
      <rect x="664" y="90" width="14" height="14" rx="7"/>
      <rect x="688" y="90" width="14" height="14" rx="7"/>
      <rect x="712" y="90" width="14" height="14" rx="7"/>
    </g>
    <g id="cooler-fan">
      <rect x="580" y="120" width="34" height="158" rx="5" fill="#2b313b"/>
      <rect x="586" y="130" width="22" height="138" rx="4" fill="#1a1e25"/>
      <g fill="#414a58">
        <rect x="588" y="136" width="18" height="18" rx="3"/>
        <rect x="588" y="160" width="18" height="18" rx="3"/>
        <rect x="588" y="184" width="18" height="18" rx="3"/>
        <rect x="588" y="208" width="18" height="18" rx="3"/>
        <rect x="588" y="232" width="18" height="18" rx="3"/>
      </g>
    </g>
  </g>

  <!-- ══ case-glass ══ must stay last so it sits above everything -->
  <g id="case-glass">
    <rect x="95" y="50" width="785" height="680" fill="url(#g-glass)"/>
    <path d="M95 730 L420 50 L560 50 L235 730 Z" fill="#ffffff" opacity="0.045"/>
    <path d="M560 730 L820 50 L880 50 L620 730 Z" fill="#ffffff" opacity="0.03"/>
    <rect x="95" y="50" width="785" height="680" fill="none" stroke="#7fa8cc" stroke-width="3" opacity="0.5"/>
    <g fill="#8fb4d4" opacity="0.6">
      <circle cx="118" cy="73" r="5"/><circle cx="857" cy="73" r="5"/>
      <circle cx="118" cy="707" r="5"/><circle cx="857" cy="707" r="5"/>
    </g>
  </g>

  <!-- ══ hit ══ click targets. Later siblings win, so an occluding part's
       shape must come after the shape it covers. -->
  <g id="hit">
    <rect id="hit-mobo"    x="308" y="476" width="300" height="92"/>
    <rect id="hit-io"      x="776" y="74"  width="96"  height="96"/>
    <rect id="hit-slot"    x="696" y="468" width="172" height="26"/>
    <rect id="hit-fans"    x="106" y="86"  width="170" height="350"/>
    <rect id="hit-psu"     x="610" y="606" width="262" height="122"/>
    <rect id="hit-cpu"     x="634" y="184" width="112" height="112"/>
    <rect id="hit-cooler"  x="576" y="86"  width="200" height="220"/>
    <rect id="hit-ram"     x="460" y="118" width="120" height="200"/>
    <rect id="hit-storage" x="492" y="342" width="160" height="32"/>
    <rect id="hit-gpu"     x="326" y="326" width="556" height="140"/>
    <rect id="hit-glass"   x="95"  y="50"  width="785" height="680"/>
  </g>
</svg>
