<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Take apart a modern desktop computer piece by piece, then follow each component back through the changes that made it what it is.">
<title>Inside a Desktop PC</title>
<link rel="canonical" href="https://edu.contrapaul.com/tools/pcparts/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="contrapaul / edu">
<meta property="og:title" content="Inside a Desktop PC">
<meta property="og:description" content="Take apart a modern desktop computer piece by piece, then follow each component back through the changes that made it what it is.">
<meta property="og:url" content="https://edu.contrapaul.com/tools/pcparts/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="css/pcparts.css">
<link rel="stylesheet" href="css/machine.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/tools.css">
</head>
<body class="pc-machine">

<header class="bar">
  <a href="/tools">A project by Mr. K, more at edu.contrapaul.com/tools</a>
</header>

<div class="stage" id="stage">
  <p class="stage-loading">Loading</p>

  <div class="detail" id="detail" role="dialog" aria-labelledby="detail-title" tabindex="-1" hidden>
    <button class="detail-close" id="detail-close" aria-label="Close">&#10005;</button>
    <div id="detail-body"></div>
  </div>

  <div class="chart-tip machine-tip" id="machine-tip" hidden>
    <span class="tip-name"></span>
    <span class="tip-value"></span>
    <span class="tip-meta"></span>
  </div>

  <div class="tray" id="tray"></div>
</div>

<div class="explore" id="explore" role="dialog" aria-labelledby="explore-title" hidden>
  <header class="explore-bar">
    <h2 id="explore-title"></h2>
    <span class="explore-span" id="explore-span"></span>
    <button type="button" class="explore-back" id="explore-back">Back to the machine</button>
  </header>
  <div class="explore-scroll" id="explore-scroll">
    <div class="explore-inner" id="explore-inner"></div>
  </div>
</div>

<script type="module" src="js/machine.js"></script>
</body>
</html>
