<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#0e1013; color:#d8dde5;
  font-family:'Segoe UI',Arial,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
#wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#stage { position:relative; width:1240px; height:740px; transform-origin:center center; }

.panel { position:absolute; background:#191d23; border:1px solid #2e343d; border-radius:4px; }
.panel.hot { border-color:#5f6a78; background:#1d222a; }
.plabel { position:absolute; top:6px; left:10px; font-size:11px; letter-spacing:2px; color:#5d6673; }
.readout { position:absolute; top:2px; right:10px; font-family:ui-monospace,Menlo,monospace;
  font-size:22px; color:#e0a33a; }
.readout u { font-size:10px; color:#5d6673; letter-spacing:1px; text-decoration:none; }
.hk { position:absolute; bottom:5px; right:8px; font-family:ui-monospace,Menlo,monospace;
  font-size:11px; color:#4d5765; }
.slot { position:absolute; border:2px dashed #333a44; border-radius:3px; }

/* header */
#hud { position:absolute; left:0; top:0; width:1240px; height:76px; }
#dayLbl { position:absolute; left:24px; top:22px; font-size:22px; letter-spacing:4px; color:#8b95a3; }
#specs { position:absolute; left:150px; top:10px; display:flex; gap:16px; }
.card { width:196px; }
.card .cn { font-size:10px; letter-spacing:2px; color:#5d6673; }
.card .cv { font-family:ui-monospace,Menlo,monospace; font-size:17px; color:#d8dde5; margin:1px 0 3px; }
.card .cb { height:9px; border-radius:2px; }
#money { position:absolute; right:24px; top:14px; font-family:ui-monospace,Menlo,monospace;
  font-size:28px; color:#d8dde5; }
#cx { position:absolute; right:24px; top:50px; display:flex; gap:6px; justify-content:flex-end; }
.cxd { width:11px; height:11px; border-radius:50%; background:#2e343d; }
.cxd.on { background:#d9534f; }
#prog { position:absolute; left:0; top:74px; width:1240px; height:3px; background:#20242b; }
#prog i { display:block; height:100%; width:0; background:#4a5563; }

/* tray + infeed */
#tray { position:absolute; left:24px; top:88px; width:980px; height:100px;
  border:1px dashed #2e343d; border-radius:4px; }

/* parts */
.part { position:absolute; border:1px solid #6d7f95; border-radius:3px;
  cursor:grab; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:ui-monospace,Menlo,monospace; color:#cdd6e2; z-index:20;
  transition:transform .30s cubic-bezier(.2,.8,.3,1), width .30s ease; }
.part.drag { cursor:grabbing; z-index:100; transition:none; box-shadow:0 8px 24px rgba(0,0,0,.6); }
.part .pn { font-size:12px; letter-spacing:1px; }
.part .pid { font-size:9px; color:#8fa0b4; }
.part .tag { font-size:13px; color:#e0a33a; min-height:15px; }
.part.out { transition:transform .45s ease-in, opacity .45s ease-in; opacity:0; }
.part.read { border-color:#e0a33a; }
.part.hover { box-shadow:0 0 0 2px #8b95a3; }

/* bins */
.bin { position:absolute; border:2px solid #333a44; border-radius:4px;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px;
  font-size:13px; letter-spacing:4px; }
#ship { left:24px; top:436px; width:330px; height:140px; border-color:#2f5a3d; color:#4caf6a; }
#scrap { left:374px; top:436px; width:330px; height:140px; border-color:#5a3232; color:#c96a66; }
.bin.hot { background:#20262d; }

/* rig A */
#rigA { left:24px; top:206px; width:250px; height:210px; }
#aSlot { left:88px; top:52px; width:74px; height:74px; }
#bSlot { left:22px; top:52px; width:76px; height:76px; }
#cSlot { left:20px; top:46px; width:76px; height:76px; }
#aBar { position:absolute; left:20px; top:136px; width:210px; height:5px; background:#20242b; border-radius:3px; }
#aBar i { display:block; height:100%; width:0; background:#a06a3a; border-radius:3px; }
#aLamp { position:absolute; left:20px; top:154px; width:210px; height:26px; border-radius:3px;
  background:#20242b; display:flex; align-items:center; justify-content:center;
  font-size:12px; letter-spacing:3px; color:#5d6673; }

/* rig B */
#rigB { left:294px; top:206px; width:620px; height:210px; }
#bLamp { position:absolute; left:130px; top:4px; width:96px; height:20px; border-radius:2px;
  background:#20242b; display:flex; align-items:center; justify-content:center;
  font-size:10px; letter-spacing:2px; color:#5d6673; }
#bHandle { position:absolute; background:#8c98a8; border-radius:2px; cursor:ew-resize; z-index:30; }
#bAnvil { position:absolute; width:12px; background:#8c98a8; border-radius:2px; }
#bRule { position:absolute; height:34px; }
#bBand { position:absolute; height:10px; border-radius:2px; }
#bPtr { position:absolute; width:2px; height:18px; background:#e8eef6; z-index:31; }

/* rig C */
#rigC { left:934px; top:206px; width:282px; height:210px; }
#cKnob { position:absolute; border-radius:50%; background:#39414c; border:2px solid #5f6a78;
  cursor:grab; z-index:30; }
#cKnob .mk { position:absolute; left:50%; top:3px; width:3px; height:15px; background:#c9d2dd; margin-left:-1.5px; }
#cNull { position:absolute; height:22px; background:#12161b; border:1px solid #2e343d; border-radius:2px; }
#cNeedle { position:absolute; width:3px; height:22px; background:#e0a33a; z-index:31; }
#cZero { position:absolute; width:1px; height:22px; background:#5d6673; }

/* line panel */
#line { left:724px; top:436px; width:492px; height:280px; }
#chart { position:absolute; left:20px; top:46px; }
#leverTrack { position:absolute; left:350px; top:56px; width:38px; height:150px;
  background:#12161b; border:1px solid #2e343d; border-radius:19px; }
#lever { position:absolute; left:342px; top:56px; width:54px; height:38px; background:#5a3232;
  border:1px solid #8a4a46; border-radius:6px; cursor:grab; z-index:30; }
#leverTxt { position:absolute; left:314px; top:216px; width:112px; text-align:center;
  font-size:10px; letter-spacing:2px; color:#5d6673; }

/* fx */
.float { position:absolute; font-family:ui-monospace,Menlo,monospace; font-size:20px;
  pointer-events:none; z-index:200; transition:transform .9s ease-out, opacity .9s ease-out; }

/* overlay */
#ov { position:absolute; inset:0; background:rgba(8,10,13,.94); z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
#ov.hide { display:none; }
#ov h1 { font-size:38px; letter-spacing:8px; font-weight:400; color:#d8dde5; }
#ov .big { font-family:ui-monospace,Menlo,monospace; font-size:52px; }
#ov .row { display:flex; gap:40px; font-family:ui-monospace,Menlo,monospace; font-size:19px; color:#8b95a3; }
#ov .row b { display:block; color:#d8dde5; font-size:26px; font-weight:400; }
#ov button { background:#2a323c; color:#d8dde5; border:1px solid #454e5a; border-radius:3px;
  padding:13px 44px; font-size:16px; letter-spacing:4px; cursor:pointer; font-family:inherit; }
#ov button:hover { background:#343d49; }
.leg { display:flex; gap:20px; font-size:12px; color:#8b95a3; align-items:center; }
.leg span { display:flex; gap:7px; align-items:center; }
.leg i { width:10px; height:10px; border-radius:50%; display:block; }
.nx { display:flex; gap:14px; font-size:11px; letter-spacing:2px; color:#5d6673; }
.gname { font-size:15px; letter-spacing:14px; color:#5d6673; margin-bottom:-8px; }
</style>

<body>
<div id="wrap"><div id="stage">

  <div id="hud">
    <div id="dayLbl">DAY 1</div>
    <div id="specs"></div>
    <div id="money">$1,000</div>
    <div id="cx"></div>
    <div id="prog"><i></i></div>
  </div>

  <div id="tray"></div>

  <div class="panel" id="rigA">
    <div class="plabel" id="aName"></div>
    <div class="slot" id="aSlot"></div>
    <div id="aBar"><i></i></div>
    <div id="aLamp"></div>
    <div class="hk">1</div>
  </div>

  <div class="panel" id="rigB">
    <div class="plabel" id="bName"></div>
    <div class="slot" id="bSlot"></div>
    <div id="bLamp"></div>
    <div class="readout" id="bRead">--</div>
    <div class="hk">2</div>
  </div>

  <div class="panel" id="rigC">
    <div class="plabel" id="cName"></div>
    <div class="slot" id="cSlot"></div>
    <div class="readout" id="cRead">--</div>
    <div class="hk">3</div>
  </div>

  <div class="bin" id="ship">SHIP<div class="hk">S</div></div>
  <div class="bin" id="scrap">SCRAP<div class="hk">X</div></div>

  <div class="panel" id="line">
    <div class="plabel">LINE</div>
    <canvas id="chart"></canvas>
    <div id="leverTrack"></div>
    <div id="lever"></div>
    <div id="leverTxt"></div>
  </div>

  <div id="bAnvil"></div>
  <div id="bBand"></div>
  <canvas id="bRule"></canvas>
  <div id="bHandle"></div>
  <div id="bPtr"></div>

  <div id="cNull"></div>
  <div id="cZero"></div>
  <div id="cNeedle"></div>
  <div id="cKnob"><div class="mk"></div></div>

  <div id="parts"></div>
  <div id="fx"></div>
  <div id="ov" class="hide"></div>
</div></div>

<script>
"use strict";

/* ================= products =================
   Every product reduces to one hidden scalar with a spec band.
   Three rigs read that scalar in different ways:
     A  binary, hands free, slow to cycle
     B  coarse sweep, you find the crossover yourself
     C  fine null, you rotate until the needle centres
================================================ */
const P = {
  pin:  { tile:"PIN",  unit:"mm",  nom:10.00, dec:2, span:0.90, coarse:0.1,  fine:0.01,
          baseL:0.20, color:"#4a5a6e", edge:"#6d7f95",
          a:"GO / NO GO", b:"CALIPER", c:"MICROMETER",
          aPass:"GO", aFail:"NO GO", bLo:"OPEN", bHi:"OPEN", bMatch:"CONTACT", contact:true },
  cell: { tile:"CELL", unit:"V",   nom:3.70,  dec:2, span:0.60, coarse:0.05, fine:0.005,
          baseL:0.12, color:"#5c5433", edge:"#9a8c50",
          a:"LOAD TEST", b:"COMPARATOR", c:"NULL METER",
          aPass:"HOLDS", aFail:"SAGS", bLo:"CELL HIGHER", bHi:"CELL LOWER", bMatch:"BALANCED" },
  board:{ tile:"BRD",  unit:"ms",  nom:600,   dec:0, span:400,  coarse:20,   fine:2,
          baseL:50, color:"#2f4d43", edge:"#4e8574",
          a:"BOOT", b:"WATCHDOG", c:"TRACE",
          aPass:"BOOTS", aFail:"HANGS", bLo:"TIMED OUT", bHi:"BOOTED", bMatch:"EDGE" },
  lamp: { tile:"LED",  unit:"mcd", nom:120,   dec:0, span:80,   coarse:5,    fine:1,
          baseL:12, color:"#5a4527", edge:"#a07a44",
          a:"PRESS TEST", b:"PHOTOCELL", c:"PHOTOMETER",
          aPass:"LIGHTS", aFail:"DEAD", bLo:"BRIGHTER", bHi:"DIMMER", bMatch:"MATCHED" },
  horn: { tile:"HRN",  unit:"Hz",  nom:1000,  dec:0, span:150,  coarse:10,   fine:1,
          baseL:24, color:"#443a5c", edge:"#7a67a8",
          a:"SOUND TEST", b:"PITCH", c:"TUNER",
          aPass:"IN TUNE", aFail:"WRONG TONE", bLo:"UNIT HIGHER", bHi:"UNIT LOWER", bMatch:"UNISON",
          audio:true }
};
const ORDER = ["pin","cell","board","lamp","horn"];

function lineup(d){
  if(d <= 5) return [ORDER[d-1]];
  if(d <= 8) return [ORDER[((d-6)*2)%5], ORDER[((d-6)*2+1)%5]];
  return [ORDER[d%5], ORDER[(d+1)%5], ORDER[(d+2)%5]];
}
function tolOf(prod, d){ return P[prod].baseL * Math.max(0.40, Math.pow(0.90, d-1)); }
function sigmaOf(prod, d){ return tolOf(prod,d) / 1.25; }   // about 21 percent out of spec
function countOf(d){ return 16 + 2*(d-1); }
function intervalOf(d){ return Math.max(1.3, 3.4 - 0.15*(d-1)); }

/* ================= economy ================= */
const BASE = 100, RETURN_FEE = 150, SCRAP_COST = 20, MAX_CX = 4;
const START_BAL = 1000, STOP_COST = 250;
const KEY = "shiftSaveV1";

/* ================= career ================= */
let G = { day:1, bal:START_BAL, best:0, bestDay:1 };
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) Object.assign(G,s); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(G)); }catch(e){} }

let R = null, running = false;

/* ================= dom ================= */
const $ = s => document.querySelector(s);
const stage = $("#stage"), partsLayer = $("#parts"), fx = $("#fx"), ov = $("#ov");
const bHandle = $("#bHandle"), bAnvil = $("#bAnvil"), bRule = $("#bRule"), bBand = $("#bBand"), bPtr = $("#bPtr");
const cKnob = $("#cKnob"), cNull = $("#cNull"), cNeedle = $("#cNeedle"), cZero = $("#cZero");
const chart = $("#chart"), lever = $("#lever");

function fit(){
  const k = Math.min(window.innerWidth/1240, window.innerHeight/740);
  stage.style.transform = "scale(" + k + ")"; stage._k = k;
}
window.addEventListener("resize", fit); fit();
function toStage(e){ const r = stage.getBoundingClientRect(); return { x:(e.clientX-r.left)/stage._k, y:(e.clientY-r.top)/stage._k }; }

/* ================= geometry ================= */
const TRAY_X = 38, TRAY_Y = 94, SLOT_W = 96, CAP = 10;
const A_X = 24,  A_Y = 206;
const B_X = 294, B_Y = 206;
const C_X = 934, C_Y = 206;

const RULE_X0 = B_X + 116, RULE_W = 480;              // 410 .. 890
const RULE_ZERO = RULE_X0 + RULE_W/2;                 // 650
const PIN_W = 120;                                    // pin tile width at nominal
const RULE_Y = B_Y + 130, BAND_Y = B_Y + 172;

const KNOB_X = C_X + 176, KNOB_Y = C_Y + 34, KNOB_D = 76;
const NULL_X = C_X + 20,  NULL_Y = C_Y + 150, NULL_W = 242;

const ZONES = {
  ship: {x:24,y:436,w:330,h:140}, scrap:{x:374,y:436,w:330,h:140},
  a:{x:A_X,y:A_Y,w:250,h:210}, b:{x:B_X,y:B_Y,w:620,h:210}, c:{x:C_X,y:C_Y,w:282,h:210}
};
function inZone(z,p){ return p.x>=z.x && p.x<=z.x+z.w && p.y>=z.y && p.y<=z.y+z.h; }

/* ================= helpers ================= */
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function money(n){ return (n<0?"-$":"$") + Math.abs(Math.round(n)).toLocaleString(); }
function qColor(r){ r=Math.abs(r);
  if(r<=0.4) return "#4caf6a"; if(r<=0.75) return "#a8b84a";
  if(r<=1.0) return "#e0a33a"; if(r<=1.5) return "#d97a3a"; return "#d9534f"; }
function bandGrad(){ return "linear-gradient(90deg,#d9534f 0%,#e0a33a 12%,#4caf6a 42%,#4caf6a 58%,#e0a33a 88%,#d9534f 100%)"; }
function fmt(prod, v){ return v.toFixed(P[prod].dec); }
function ppu(prod){ return RULE_W / (2*P[prod].span); }

/* audio for the horn */
let AC = null;
function beep(freq, dur){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "square"; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  }catch(e){}
}

/* ================= parts ================= */
function makePart(){
  const prod = R.lineup[Math.floor(Math.random()*R.lineup.length)];
  const p0 = P[prod];
  const L = R.tol[prod], sg = R.sig[prod];
  const val = p0.nom + R.bias[prod] + gauss()*sg;
  R.produced++;

  const p = { id:R.produced, prod:prod, val:val, dev:val-p0.nom, L:L,
              state:"tray", slot:-1, reading:null, disp:null,
              _x:-120, _y:TRAY_Y };
  const el = document.createElement("div");
  el.className = "part";
  el.style.background = p0.color; el.style.borderColor = p0.edge;
  el.innerHTML = '<span class="pid">'+p.id+'</span><span class="pn">'+p0.tile+'</span><span class="tag"></span>';
  el.style.transform = "translate(-120px," + TRAY_Y + "px)";
  el.style.width = "88px"; el.style.height = "88px";
  el.addEventListener("pointerdown", e => grab(p,e));
  el.addEventListener("pointerenter", () => { if(!drag) setHover(p); });
  el.addEventListener("pointerleave", () => { if(hover===p) setHover(null); });
  p.el = el; partsLayer.appendChild(el);
  R.parts.push(p);

  let idx = R.tray.indexOf(null);
  if(idx < 0){
    const old = R.tray.reduce((a,b) => (a && a.id < b.id) ? a : b);
    dispose(old, "ship", true);
    idx = R.tray.indexOf(null);
  }
  R.tray[idx] = p; p.slot = idx;
  void el.offsetWidth;   // settle the off-screen start so the slide in actually transitions
  layout();
}

function freeSlot(p){
  if(p.state==="tray" && p.slot>=0){ R.tray[p.slot]=null; p.slot=-1; }
  if(p.state==="a") R.a=null;
  if(p.state==="b") R.b=null;
  if(p.state==="c") R.c=null;
}
function toTray(p){
  const i = R.tray.indexOf(null); if(i<0) return false;
  R.tray[i]=p; p.slot=i; p.state="tray"; return true;
}
function setReading(p, val, res){
  p.reading = val;
  const d = res < 1 ? Math.max(P[p.prod].dec, String(res).split(".")[1].length) : 0;
  p.el.querySelector(".tag").textContent = val.toFixed(d);
  p.el.querySelector(".tag").style.color = "#e0a33a";
  p.el.classList.add("read");
  R.chart.push((val - P[p.prod].nom)/p.L);
  drawChart();
}

/* ================= disposition ================= */
function dispose(p, how, auto){
  freeSlot(p);
  let v;
  if(how === "ship"){
    const r = p.dev / p.L;
    v = Math.round(BASE*(1 - r*r));
    if(Math.abs(r) > 1){ v -= RETURN_FEE; R.cx++; renderCx(); }
    v = Math.max(-500, v);
  } else v = -SCRAP_COST;

  p.disp = how; p.state = "gone";
  R.dayMoney += v; G.bal += v; renderHud();
  floater(p._x + 26, p._y + 20, (v>=0?"+":"") + v, v>=0?"#4caf6a":"#d9534f", auto);

  const el = p.el;
  el.classList.add("out");
  el.style.transform = "translate(" + (p._x + (how==="ship"?90:0)) + "px," + (p._y + (how==="ship"?0:70)) + "px)";
  setTimeout(()=>el.remove(), 460);

  layout();
  if(R.cx >= MAX_CX) endRun("CONTRACT LOST");
  else if(G.bal < 0) endRun("BANKRUPT");
}
function floater(x,y,txt,col,auto){
  const d = document.createElement("div");
  d.className="float"; d.textContent=txt; d.style.color=col;
  d.style.left=x+"px"; d.style.top=y+"px"; if(auto) d.style.opacity=".6";
  fx.appendChild(d);
  requestAnimationFrame(()=>{ d.style.transform="translateY(-40px)"; d.style.opacity="0"; });
  setTimeout(()=>d.remove(), 950);
}

/* ================= drag ================= */
let drag = null, hover = null;
function setHover(p){
  if(hover === p) return;
  if(hover) hover.el.classList.remove("hover");
  hover = p;
  if(hover) hover.el.classList.add("hover");
}
function highlight(s){
  $("#ship").classList.toggle("hot", !!s && inZone(ZONES.ship,s));
  $("#scrap").classList.toggle("hot", !!s && inZone(ZONES.scrap,s));
  $("#rigA").classList.toggle("hot", !!s && !R.a && inZone(ZONES.a,s));
  $("#rigB").classList.toggle("hot", !!s && !R.b && inZone(ZONES.b,s));
  $("#rigC").classList.toggle("hot", !!s && !R.c && inZone(ZONES.c,s));
}
function grab(p,e){
  if(!running || p.state==="gone") return;
  if(p.state==="a" && R.aT>0) return;
  e.preventDefault();
  const s = toStage(e);
  drag = { p:p, dx:s.x-p._x, dy:s.y-p._y, from:p.state };
  freeSlot(p); p.state="drag"; p.el.classList.add("drag");
  p.el.setPointerCapture(e.pointerId);
  layout();
}
window.addEventListener("pointermove", e => {
  if(!drag) return;
  const s = toStage(e);
  drag.p._x = s.x-drag.dx; drag.p._y = s.y-drag.dy;
  drag.p.el.style.transform = "translate("+drag.p._x+"px,"+drag.p._y+"px)";
  highlight(s);
});
window.addEventListener("pointerup", e => {
  if(!drag) return;
  const p = drag.p, s = toStage(e), from = drag.from;
  drag = null;
  p.el.classList.remove("drag");
  highlight(null);
  const ctr = { x:p._x + p.el.offsetWidth/2, y:p._y + p.el.offsetHeight/2 };

  if(inZone(ZONES.ship,ctr)) { dispose(p,"ship"); return; }
  if(inZone(ZONES.scrap,ctr)){ dispose(p,"scrap"); return; }
  if(inZone(ZONES.a,ctr) && !R.a){ seatA(p); return; }
  if(inZone(ZONES.b,ctr) && !R.b){ seatB(p); return; }
  if(inZone(ZONES.c,ctr) && !R.c){ seatC(p); return; }

  if(!toTray(p)){
    if(from==="a" && !R.a) seatA(p);
    else if(from==="b" && !R.b) seatB(p);
    else if(from==="c" && !R.c) seatC(p);
    else { dispose(p,"scrap"); return; }
  }
  layout();
});

function seatA(p){
  p.state="a"; R.a=p; R.aT=2.0; R.aPlayed=0;
  $("#aLamp").textContent=""; $("#aLamp").style.background="#20242b";
  layout();
}
function seatB(p){
  const d = P[p.prod];
  p.state="b"; R.b=p;
  R.bVal = d.contact ? d.nom + d.span : d.nom - d.span;
  R.bLast = R.bVal;
  layout();
}
function seatC(p){
  const d = P[p.prod];
  p.state="c"; R.c=p; R.cVal = d.nom - d.span*0.6; R.cAng = 0;
  layout();
}

/* ================= layout ================= */
function layout(){
  if(!R) return;
  for(const p of R.parts){
    if(p.state==="gone" || p.state==="drag") continue;
    let w=88, h=88;
    if(p.state==="tray"){ p._x = TRAY_X + p.slot*SLOT_W; p._y = TRAY_Y; }
    else if(p.state==="a"){ w=74; h=74; p._x = A_X+88; p._y = A_Y+52; }
    else if(p.state==="b"){
      if(P[p.prod].contact){ w = PIN_W + p.dev*ppu(p.prod); h=96; p._x = RULE_ZERO-PIN_W; p._y = B_Y+40; }
      else { w=76; h=76; p._x = B_X+22; p._y = B_Y+52; }
    }
    else if(p.state==="c"){ w=76; h=76; p._x = C_X+20; p._y = C_Y+46; }
    p.el.style.width=w+"px"; p.el.style.height=h+"px";
    p.el.style.transform = "translate("+p._x+"px,"+p._y+"px)";
  }
  rigs();
}

/* ================= rigs =================
   Idle rigs stay blank until the first part goes in, then keep the name of
   whatever was last tested so the bench reads back what it is.
========================================== */
function rigName(slot, prod){
  if(prod) R.seen[slot] = P[prod][slot];
  return R.seen[slot] || "";
}
function rigs(){
  // rig A
  const pa = R.a;
  $("#aName").textContent = rigName("a", pa && pa.prod);
  $("#aSlot").style.display = pa ? "none" : "block";

  // rig B
  const pb = R.b, d = pb ? P[pb.prod] : null;
  const show = !!pb;
  [bHandle,bAnvil,bRule,bBand,bPtr].forEach(el => el.style.display = show?"block":"none");
  $("#bLamp").style.display = show?"flex":"none";
  $("#bName").textContent = rigName("b", pb && pb.prod);
  const bs = $("#bSlot");
  bs.style.display = show ? "none" : "block";
  bs.style.left = (P[R.lineup[0]].contact ? RULE_ZERO-PIN_W-B_X : 22) + "px";
  if(show){
    const u = ppu(pb.prod);
    const hx = RULE_ZERO + (R.bVal - d.nom)*u;
    const tall = d.contact;
    bHandle.style.width="12px"; bHandle.style.height = tall?"96px":"64px";
    bHandle.style.transform = "translate("+hx+"px,"+(B_Y+(tall?40:58))+"px)";
    bAnvil.style.height = "96px";
    bAnvil.style.display = d.contact ? "block":"none";
    bAnvil.style.transform = "translate("+(RULE_ZERO-PIN_W-12)+"px,"+(B_Y+40)+"px)";

    const bw = 2*pb.L*u, bx = RULE_ZERO - pb.L*u;
    bBand.style.transform = "translate("+bx+"px,"+BAND_Y+"px)";
    bBand.style.width = bw+"px"; bBand.style.background = bandGrad();
    bPtr.style.transform = "translate("+(hx+5)+"px,"+(BAND_Y-4)+"px)";
    drawRule(pb.prod);

    const v = Math.round(R.bVal/d.coarse)*d.coarse;
    $("#bRead").innerHTML = fmt(pb.prod, v) + ' <u>' + d.unit + '</u>';
    $("#bRead").style.color = qColor((v-d.nom)/pb.L);

    const diff = R.bVal - pb.val;
    const lamp = $("#bLamp");
    if(Math.abs(diff) <= d.coarse*0.5){ lamp.textContent=d.bMatch; lamp.style.background="#1e3a28"; lamp.style.color="#4caf6a"; }
    else { lamp.textContent = diff<0 ? d.bLo : d.bHi; lamp.style.background="#20242b"; lamp.style.color="#8b95a3"; }
  } else { $("#bRead").textContent="--"; $("#bRead").style.color="#e0a33a"; }

  // rig C
  const pc = R.c, e = pc ? P[pc.prod] : null;
  const shown = !!pc;
  [cKnob,cNull,cNeedle,cZero].forEach(el => el.style.display = shown?"block":"none");
  $("#cName").textContent = rigName("c", pc && pc.prod);
  $("#cSlot").style.display = shown ? "none" : "block";
  if(shown){
    cKnob.style.width=KNOB_D+"px"; cKnob.style.height=KNOB_D+"px";
    cKnob.style.transform = "translate("+KNOB_X+"px,"+KNOB_Y+"px) rotate("+R.cAng+"rad)";
    cNull.style.transform = "translate("+NULL_X+"px,"+NULL_Y+"px)";
    cNull.style.width = NULL_W+"px";
    cZero.style.transform = "translate("+(NULL_X+NULL_W/2)+"px,"+NULL_Y+"px)";
    const diff = pc.val - R.cVal;
    const f = Math.max(-1, Math.min(1, diff/(e.fine*10)));
    cNeedle.style.transform = "translate("+(NULL_X+NULL_W/2+f*NULL_W/2 - 1)+"px,"+NULL_Y+"px)";
    cNeedle.style.background = Math.abs(diff) <= e.fine*0.5 ? "#4caf6a" : "#e0a33a";
    const v = Math.round(R.cVal/e.fine)*e.fine;
    $("#cRead").innerHTML = fmt(pc.prod, v) + ' <u>' + e.unit + '</u>';
    $("#cRead").style.color = qColor((v-e.nom)/pc.L);
  } else { $("#cRead").textContent="--"; $("#cRead").style.color="#e0a33a"; }
}

function drawRule(prod){
  const d = P[prod], u = ppu(prod), w = RULE_W+40, h = 34;
  const dpr = window.devicePixelRatio||1;
  bRule.width=w*dpr; bRule.height=h*dpr; bRule.style.width=w+"px"; bRule.style.height=h+"px";
  bRule.style.transform = "translate("+(RULE_X0-20)+"px,"+RULE_Y+"px)";
  const g = bRule.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  g.strokeStyle="#5d6673"; g.fillStyle="#8b95a3";
  g.font="10px ui-monospace,monospace"; g.textAlign="center";
  const step = d.coarse, n = Math.floor(d.span/step);
  for(let i=-n;i<=n;i++){
    const v = d.nom + i*step, x = 20 + RULE_W/2 + i*step*u;
    if(x<0||x>w) continue;
    const major = (i%5===0);
    g.beginPath(); g.moveTo(x,0); g.lineTo(x, major?14:8); g.stroke();
    if(major) g.fillText(fmt(prod,v), x, 26);
  }
}

/* rig B drag */
bHandle.addEventListener("pointerdown", e => {
  if(!R || !R.b) return;
  e.preventDefault(); bHandle.setPointerCapture(e.pointerId);
  const p = R.b, d = P[p.prod], u = ppu(p.prod);
  const x0 = toStage(e).x, v0 = R.bVal;
  const mv = ev => {
    let v = v0 + (toStage(ev).x - x0)/u;
    if(d.contact) v = Math.max(p.val, Math.min(d.nom + d.span, v));
    else v = Math.max(d.nom - d.span, Math.min(d.nom + d.span, v));
    R.bVal = v;
    if(Math.abs(v - p.val) <= d.coarse*0.5) setReading(p, Math.round(v/d.coarse)*d.coarse, d.coarse);
    if(d.audio && Math.abs(v - R.bLast) >= d.coarse){ R.bLast = v; beep(v, 0.09); }
    rigs();
  };
  const up = () => { window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
});

/* rig C rotation */
cKnob.addEventListener("pointerdown", e => {
  if(!R || !R.c) return;
  e.preventDefault(); cKnob.setPointerCapture(e.pointerId);
  const p = R.c, d = P[p.prod];
  const cx = KNOB_X+KNOB_D/2, cy = KNOB_Y+KNOB_D/2;
  let last = Math.atan2(toStage(e).y-cy, toStage(e).x-cx);
  const perTurn = d.span*0.30;
  const mv = ev => {
    const s = toStage(ev);
    const a = Math.atan2(s.y-cy, s.x-cx);
    let dv = a-last; while(dv>Math.PI) dv-=2*Math.PI; while(dv<-Math.PI) dv+=2*Math.PI;
    last = a; R.cAng += dv;
    R.cVal = Math.max(d.nom-d.span, Math.min(d.nom+d.span, R.cVal + (dv/(2*Math.PI))*perTurn));
    if(Math.abs(R.cVal - p.val) <= d.fine*0.5) setReading(p, Math.round(R.cVal/d.fine)*d.fine, d.fine);
    rigs();
  };
  const up = () => { window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
});

/* stop the line */
lever.addEventListener("pointerdown", e => {
  if(!R || R.stopped || !running) return;
  e.preventDefault(); lever.setPointerCapture(e.pointerId);
  const y0 = toStage(e).y, t0 = 56;
  const mv = ev => {
    const dy = Math.max(0, Math.min(112, toStage(ev).y - y0));
    lever.style.top = (t0+dy)+"px";
    if(dy >= 104) stopLine();
  };
  const up = () => {
    window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
    if(!R.stopped) lever.style.top = t0+"px";
  };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
});
function stopLine(){
  if(R.stopped) return;
  R.stopped = true;
  G.bal -= STOP_COST; R.dayMoney -= STOP_COST;
  for(const k of R.lineup) R.bias[k] = 0;
  lever.style.background="#2f5a3d"; lever.style.borderColor="#4caf6a";
  $("#leverTxt").textContent = "LINE RESET";
  floater(1000, 520, "-"+STOP_COST, "#d9534f");
  renderHud();
  if(G.bal < 0) endRun("BANKRUPT");
}

/* ================= chart ================= */
function drawChart(){
  const w=280, h=190, dpr=window.devicePixelRatio||1;
  chart.width=w*dpr; chart.height=h*dpr; chart.style.width=w+"px"; chart.style.height=h+"px";
  const g = chart.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const y = nd => h/2 - (nd/2.6)*(h/2);
  g.fillStyle="#12161b"; g.fillRect(0,0,w,h);
  g.fillStyle="rgba(76,175,106,.10)"; g.fillRect(0,y(1),w,y(-1)-y(1));
  g.strokeStyle="#3d4a56"; g.setLineDash([4,4]);
  [1,-1].forEach(v=>{ g.beginPath(); g.moveTo(0,y(v)); g.lineTo(w,y(v)); g.stroke(); });
  g.setLineDash([]);
  g.strokeStyle="#2e343d"; g.beginPath(); g.moveTo(0,y(0)); g.lineTo(w,y(0)); g.stroke();
  const data = R.chart.slice(-36);
  data.forEach((nd,i)=>{
    const x = 8 + i*((w-16)/35);
    g.fillStyle = qColor(nd);
    g.beginPath(); g.arc(x, Math.max(3,Math.min(h-3,y(nd))), 3.2, 0, 7); g.fill();
  });
}

/* ================= hud ================= */
function renderHud(){
  $("#dayLbl").textContent = "DAY " + G.day;
  $("#money").textContent = money(G.bal);
  $("#money").style.color = G.bal < 200 ? "#d9534f" : "#d8dde5";
  $("#prog i").style.width = (100*R.produced/R.count) + "%";
}
function renderSpecs(){
  const el = $("#specs"); el.innerHTML = "";
  for(const k of R.lineup){
    const d = P[k], L = R.tol[k];
    const c = document.createElement("div"); c.className="card";
    c.innerHTML = '<div class="cn">'+d.tile+'</div>'+
      '<div class="cv">'+fmt(k,d.nom)+' <span style="color:#5d6673">&plusmn;</span> '+fmt(k,L)+
      ' <span style="font-size:11px;color:#5d6673">'+d.unit+'</span></div>'+
      '<div class="cb"></div>';
    c.querySelector(".cb").style.background = bandGrad();
    el.appendChild(c);
  }
}
function renderCx(){
  const el = $("#cx"); el.innerHTML="";
  for(let i=0;i<MAX_CX;i++){
    const d = document.createElement("div");
    d.className = "cxd" + (i<R.cx?" on":""); el.appendChild(d);
  }
}

/* ================= shift ================= */
function startDay(){
  const lu = lineup(G.day);
  R = { lineup:lu, tol:{}, sig:{}, bias:{},
        count:countOf(G.day), interval:intervalOf(G.day),
        parts:[], tray:new Array(CAP).fill(null),
        a:null, b:null, c:null, aT:0, aPlayed:0, bVal:0, bLast:0, cVal:0, cAng:0,
        produced:0, spawnT:0.9, grace:-1, dayMoney:0, cx:0, chart:[], stopped:false, seen:{} };
  for(const k of lu){
    R.tol[k] = tolOf(k, G.day);
    R.sig[k] = sigmaOf(k, G.day);
    R.bias[k] = (Math.random()*2-1) * 0.8 * R.tol[k];
  }
  partsLayer.innerHTML=""; fx.innerHTML=""; hover=null; highlight(null);
  $("#aLamp").textContent=""; $("#aLamp").style.background="#20242b";
  $("#aBar i").style.width="0%";
  $("#prog i").style.background="#4a5563";
  lever.style.top="56px"; lever.style.background="#5a3232"; lever.style.borderColor="#8a4a46";
  $("#leverTxt").textContent = "STOP LINE  " + money(-STOP_COST);
  renderSpecs(); renderHud(); renderCx(); drawChart(); layout();
  ov.classList.add("hide");
  running = true; last = performance.now();
}

let last = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min((t-last)/1000, 0.1); last = t;
  if(!running || !R) return;

  if(R.produced < R.count){
    R.spawnT -= dt;
    if(R.spawnT<=0){ makePart(); R.spawnT = R.interval; renderHud(); }
  } else if(R.grace < 0){ R.grace = 8; $("#prog i").style.background="#8a5a2a"; }
  else {
    R.grace -= dt;
    $("#prog i").style.width = (100*Math.max(0,R.grace)/8)+"%";
    if(R.grace<=0){ endDay(); return; }
  }

  if(R.a && R.aT > 0){
    const d = P[R.a.prod];
    R.aT -= dt;
    $("#aBar i").style.width = (100*(1-R.aT/2.0))+"%";
    if(d.audio){
      if(R.aPlayed===0 && R.aT<=1.3){ R.aPlayed=1; beep(d.nom, 0.35); }
      if(R.aPlayed===1 && R.aT<=0.7){ R.aPlayed=2; beep(R.a.val, 0.35); }
    }
    if(R.aT<=0){
      const pass = Math.abs(R.a.dev) <= R.a.L;
      const tg = R.a.el.querySelector(".tag");
      tg.textContent = pass ? "OK" : "BAD";
      tg.style.color = pass ? "#4caf6a" : "#d9534f";
      const lamp = $("#aLamp");
      lamp.textContent = pass ? d.aPass : d.aFail;
      lamp.style.background = pass ? "#1e3a28" : "#3a1e1e";
      lamp.style.color = pass ? "#4caf6a" : "#d9534f";
    }
  } else if(!R.a){ $("#aBar i").style.width="0%"; }
}
requestAnimationFrame(loop);

function endDay(){
  running = false;
  for(const p of R.parts.slice()) if(p.state!=="gone" && p.state!=="drag") dispose(p,"ship",true);
  if(G.bal < 0) return endRun("BANKRUPT");
  if(R.cx >= MAX_CX) return endRun("CONTRACT LOST");
  debrief();
}

/* ================= debrief ================= */
function debrief(){
  const shipped = R.parts.filter(p=>p.disp==="ship");
  const scrapped = R.parts.filter(p=>p.disp==="scrap");
  const escapes = shipped.filter(p=>Math.abs(p.dev)>p.L).length;
  const falseRej = scrapped.filter(p=>Math.abs(p.dev)<=p.L).length;

  ov.classList.remove("hide"); ov.innerHTML="";
  const h=document.createElement("h1"); h.textContent="DAY "+G.day; ov.appendChild(h);
  const big=document.createElement("div"); big.className="big";
  big.textContent=(R.dayMoney>=0?"+":"")+money(R.dayMoney);
  big.style.color=R.dayMoney>=0?"#4caf6a":"#d9534f"; ov.appendChild(big);

  const cv=document.createElement("canvas"); cv.style.border="1px solid #2e343d";
  ov.appendChild(cv); drawDebrief(cv);

  const leg=document.createElement("div"); leg.className="leg";
  leg.innerHTML='<span><i style="background:#4caf6a"></i>shipped in spec</span>'+
    '<span><i style="background:#d9534f"></i>shipped out of spec</span>'+
    '<span><i style="background:#8b95a3"></i>scrapped in spec</span>'+
    '<span><i style="background:#5d6673"></i>scrapped out of spec</span>';
  ov.appendChild(leg);

  const row=document.createElement("div"); row.className="row";
  row.innerHTML='<div>escapes<b style="color:'+(escapes?"#d9534f":"#4caf6a")+'">'+escapes+'</b></div>'+
    '<div>scrapped good<b>'+falseRej+'</b></div>'+
    '<div>shipped<b>'+shipped.length+'</b></div>'+
    '<div>balance<b>'+money(G.bal)+'</b></div>';
  ov.appendChild(row);

  const nx=document.createElement("div"); nx.className="nx";
  nx.innerHTML = lineup(G.day+1).map(k=>P[k].tile).join("  /  ");
  ov.appendChild(nx);

  const b=document.createElement("button"); b.textContent="DAY "+(G.day+1);
  b.onclick=()=>{ G.day++; if(G.day>G.bestDay) G.bestDay=G.day; save(); startDay(); };
  ov.appendChild(b);
  if(G.bal>G.best) G.best=G.bal;
  save();
}
function drawDebrief(cv){
  const w=760,h=230,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#12161b"; g.fillRect(0,0,w,h);
  const nds = R.parts.map(p=>p.dev/p.L);
  const span = Math.max(2.6, Math.max.apply(null, nds.map(Math.abs))*1.15);
  const y = nd => h/2 - (nd/span)*(h/2-14);
  g.fillStyle="rgba(76,175,106,.10)"; g.fillRect(0,y(1),w,y(-1)-y(1));
  g.strokeStyle="#3d4a56"; g.setLineDash([4,4]);
  [1,-1].forEach(v=>{ g.beginPath(); g.moveTo(0,y(v)); g.lineTo(w,y(v)); g.stroke(); });
  g.setLineDash([]);
  g.strokeStyle="#2e343d"; g.beginPath(); g.moveTo(0,y(0)); g.lineTo(w,y(0)); g.stroke();
  const n = R.parts.length;
  R.parts.forEach((p,i)=>{
    const x = 14 + i*((w-28)/Math.max(1,n-1));
    const ins = Math.abs(p.dev) <= p.L;
    g.fillStyle = p.disp==="ship" ? (ins?"#4caf6a":"#d9534f") : (ins?"#8b95a3":"#5d6673");
    g.beginPath(); g.arc(x, Math.max(4,Math.min(h-4,y(p.dev/p.L))), 5, 0, 7); g.fill();
  });
}

/* ================= run end ================= */
function endRun(reason){
  running=false;
  ov.classList.remove("hide"); ov.innerHTML="";
  const h=document.createElement("h1"); h.textContent=reason; ov.appendChild(h);
  const row=document.createElement("div"); row.className="row";
  row.innerHTML='<div>reached<b>day '+G.day+'</b></div><div>best balance<b>'+money(G.best)+'</b></div>';
  ov.appendChild(row);
  const b=document.createElement("button"); b.textContent="RESTART";
  b.onclick=()=>{ G.day=1; G.bal=START_BAL; save(); startDay(); };
  ov.appendChild(b);
  save();
}

/* ================= boot ================= */
load();
R = { lineup:lineup(G.day), tol:{}, count:countOf(G.day), produced:0, chart:[], seen:{} };
for(const k of R.lineup) R.tol[k] = tolOf(k, G.day);
renderSpecs();
ov.classList.remove("hide"); ov.innerHTML="";
(function(){
  const t=document.createElement("div"); t.className="gname"; t.textContent="SHIFT"; ov.appendChild(t);
  const h=document.createElement("h1"); h.textContent="DAY "+G.day; ov.appendChild(h);
  if(G.best>START_BAL){
    const row=document.createElement("div"); row.className="row";
    row.innerHTML='<div>best balance<b>'+money(G.best)+'</b></div><div>best day<b>'+G.bestDay+'</b></div>';
    ov.appendChild(row);
  }
  const nx=document.createElement("div"); nx.className="nx";
  nx.innerHTML = R.lineup.map(k=>P[k].tile).join("  /  "); ov.appendChild(nx);
  const b=document.createElement("button"); b.textContent="START"; b.onclick=startDay; ov.appendChild(b);
})();
window.addEventListener("keydown", e=>{
  if(e.key===" "||e.key==="Enter"){
    const btn = ov.querySelector("button");
    if(btn && !ov.classList.contains("hide")){ e.preventDefault(); btn.click(); }
    return;
  }
  // the part under the cursor answers to the keys printed on the benches
  if(hover && hover.state==="gone") setHover(null);
  if(!running || !hover || hover.state==="drag") return;
  if(hover.state==="a" && R.aT>0) return;
  const p = hover, k = e.key.toLowerCase();
  if(k==="s"){ setHover(null); dispose(p,"ship"); }
  else if(k==="x"){ setHover(null); dispose(p,"scrap"); }
  else if(k==="1" && !R.a){ freeSlot(p); seatA(p); }
  else if(k==="2" && !R.b){ freeSlot(p); seatB(p); }
  else if(k==="3" && !R.c){ freeSlot(p); seatC(p); }
});
</script>
